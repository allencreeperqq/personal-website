<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../assets/engagement.css" />
  <title>Blog 文章</title>
  <style>
    :root {
      --bg: #090f1d;
      --bg-2: #122544;
      --bg-3: #1a1740;
      --panel: rgba(15, 23, 42, 0.56);
      --panel-2: rgba(30, 41, 59, 0.5);
      --text: #e2e8f0;
      --muted: #9fb0c6;
      --border: rgba(148, 163, 184, 0.3);
      --accent: #38bdf8;
      --accent-2: #22d3ee;
      --accent-3: #818cf8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 22px;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    .bg-photo-layer {
      position: fixed;
      inset: 0;
      z-index: -2;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 1.6s ease;
    }

    .bg-photo-layer.is-active {
      opacity: 1;
    }

    .bg-tint-overlay {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(140deg, rgba(9, 15, 29, 0.12), rgba(18, 37, 68, 0.09), rgba(26, 23, 64, 0.08)),
        radial-gradient(circle at 18% 16%, rgba(56, 189, 248, 0.04), transparent 36%),
        radial-gradient(circle at 86% 84%, rgba(129, 140, 248, 0.04), transparent 38%);
    }

    .post-wrap {
      width: min(900px, 100%);
      margin: 0 auto;
      border: 1px solid var(--border);
      border-radius: 16px;
      background:
        linear-gradient(165deg, rgba(30, 41, 59, 0.54), rgba(15, 23, 42, 0.62)),
        var(--panel);
      padding: 24px;
      box-shadow: 0 24px 40px rgba(0, 0, 0, 0.35);
    }

    .top-link {
      color: #7dd3fc;
      text-decoration: none;
      border-bottom: 1px solid transparent;
    }

    .top-link:hover {
      border-bottom-color: #7dd3fc;
    }

    .post-title {
      margin: 14px 0 0;
      font-size: clamp(1.55rem, 2.8vw, 2rem);
    }

    .post-meta {
      margin-top: 8px;
      color: #bfdbfe;
      font-size: 0.95rem;
    }

    .post-body {
      margin-top: 18px;
      color: #cbd5e1;
      line-height: 1.78;
    }

    .post-body h1,
    .post-body h2,
    .post-body h3 {
      color: #dbeafe;
      margin: 1.2em 0 0.55em;
      line-height: 1.35;
    }

    .post-body p {
      margin: 0.9em 0;
    }

    .post-body ul {
      margin: 0.8em 0;
      padding-left: 1.2rem;
    }

    .post-body blockquote {
      margin: 0.95rem 0;
      padding: 0.7rem 0.9rem;
      border-left: 3px solid rgba(56, 189, 248, 0.78);
      border-radius: 0 10px 10px 0;
      background: linear-gradient(120deg, rgba(8, 47, 73, 0.3), rgba(30, 41, 59, 0.5));
      color: #dbeafe;
    }

    .post-body .md-table-wrap {
      margin: 1rem 0;
      overflow-x: auto;
    }

    .post-body table.md-table {
      width: 100%;
      min-width: 520px;
      border-collapse: collapse;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 10px;
      background: linear-gradient(150deg, rgba(15, 23, 42, 0.9), rgba(30, 41, 59, 0.7));
    }

    .post-body table.md-table th,
    .post-body table.md-table td {
      border: 1px solid rgba(148, 163, 184, 0.3);
      padding: 0.5rem 0.65rem;
      vertical-align: top;
      text-align: left;
      font-size: 0.95rem;
      line-height: 1.55;
      white-space: normal;
      word-break: break-word;
    }

    .post-body table.md-table thead {
      background: linear-gradient(135deg, rgba(8, 47, 73, 0.58), rgba(49, 46, 129, 0.46));
    }

    .post-body table.md-table tbody tr:nth-child(even) {
      background: rgba(30, 41, 59, 0.36);
    }

    .post-body code {
      background: linear-gradient(145deg, rgba(30, 41, 59, 0.86), rgba(30, 27, 75, 0.78));
      border: 1px solid rgba(129, 140, 248, 0.32);
      border-radius: 6px;
      padding: 0.1em 0.35em;
      font-family: Consolas, "Courier New", monospace;
      font-size: 0.92em;
    }

    .post-body pre.md-code-block {
      margin: 1rem 0;
      padding: 0.9rem 1rem;
      overflow-x: auto;
      border: 1px solid rgba(129, 140, 248, 0.34);
      border-radius: 12px;
      background: linear-gradient(160deg, rgba(15, 23, 42, 0.96), rgba(30, 27, 75, 0.84));
      box-shadow: inset 0 1px 0 rgba(191, 219, 254, 0.08);
    }

    .post-body pre.md-code-block code {
      display: block;
      padding: 0;
      border: 0;
      background: transparent;
      color: #e5edff;
      line-height: 1.6;
      font-size: 0.92rem;
      white-space: pre;
    }

    .post-body .md-math-block {
      margin: 1rem 0;
      padding: 0.2rem 0;
      overflow-x: auto;
    }

    .post-body a {
      color: var(--accent);
      text-decoration: none;
    }

    .post-body a:hover {
      text-decoration: underline;
    }

    .post-body img.md-image {
      display: block;
      width: min(100%, 760px);
      height: auto;
      margin: 1rem auto;
      border-radius: 12px;
      border: 1px solid rgba(94, 234, 212, 0.45);
      box-shadow: 0 14px 26px rgba(34, 211, 238, 0.16);
      background: linear-gradient(145deg, rgba(8, 47, 73, 0.26), rgba(30, 41, 59, 0.6));
    }

    .post-body .md-pdf {
      margin: 1rem 0;
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 12px;
      overflow: hidden;
      background: linear-gradient(145deg, rgba(8, 47, 73, 0.2), rgba(30, 41, 59, 0.65));
    }

    .post-body .md-pdf-title {
      padding: 0.55rem 0.75rem;
      font-size: 0.95rem;
      color: #bfdbfe;
      border-bottom: 1px solid rgba(148, 163, 184, 0.28);
      background: linear-gradient(130deg, rgba(30, 41, 59, 0.66), rgba(30, 27, 75, 0.56));
    }

    .post-body .md-pdf-frame {
      width: 100%;
      min-height: 620px;
      height: clamp(620px, 88vh, 1280px);
      border: 0;
      background: #0f172a;
    }

    .post-body .md-pdf-fallback {
      margin: 0;
      padding: 0.65rem 0.75rem;
      color: #cbd5e1;
      border-top: 1px solid rgba(148, 163, 184, 0.24);
      font-size: 0.92rem;
      background: rgba(15, 23, 42, 0.65);
    }

    .error {
      margin-top: 14px;
      color: #fca5a5;
    }

    .post-engagement-wrap {
      margin-top: 20px;
      border: 1px solid rgba(125, 211, 252, 0.28);
      border-radius: 12px;
      background: linear-gradient(145deg, rgba(15, 23, 42, 0.76), rgba(30, 41, 59, 0.58));
      padding: 14px;
    }

    .post-engagement-title {
      margin: 0;
      color: #dbeafe;
      font-size: 1.06rem;
    }

    .photo-credit {
      position: fixed;
      right: 12px;
      bottom: 10px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(2, 6, 23, 0.62);
      color: #cbd5e1;
      font-size: 0.76rem;
      line-height: 1.35;
      z-index: 95;
      max-width: min(72vw, 420px);
      text-align: right;
    }

    .site-version-note {
      position: fixed;
      left: 12px;
      bottom: 10px;
      margin: 0;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(148, 163, 184, 0.24);
      background: rgba(2, 6, 23, 0.62);
      color: #cbd5e1;
      font-size: 0.76rem;
      line-height: 1.35;
      z-index: 95;
      max-width: min(72vw, 420px);
      text-align: left;
    }

    @media (max-width: 560px) {
      .photo-credit {
        right: 8px;
        bottom: 8px;
        max-width: 84vw;
        font-size: 0.72rem;
      }

      .site-version-note {
        left: 8px;
        bottom: 8px;
        max-width: 84vw;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body>
  <div class="bg-photo-layer" id="bg-layer-a" aria-hidden="true"></div>
  <div class="bg-photo-layer" id="bg-layer-b" aria-hidden="true"></div>
  <div class="bg-tint-overlay" aria-hidden="true"></div>

  <main class="post-wrap">
    <a class="top-link" href="../index.html">回到首頁</a>
    <h1 id="post-title" class="post-title">載入中...</h1>
    <div id="post-meta" class="post-meta"></div>
    <article id="post-body" class="post-body"></article>
    <section class="post-engagement-wrap">
      <h2 class="post-engagement-title">留言互動區</h2>
      <section
        id="post-engagement"
        class="cf-engagement cf-engagement--embedded"
        data-page-key=""
        data-page-title=""
        data-turnstile-site-key=""
      ></section>
    </section>
    <p id="error-text" class="error" hidden></p>
  </main>

  <p class="site-version-note">版本：v2026.07.16 | 最後更新：2026-07-16</p>
  <p class="photo-credit">川崎工業區夜景 攝於2025/6/12 作者: 潘宇綸</p>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["$", "$"], ["\\(", "\\)"]],
        displayMath: [["$$", "$$"], ["\\[", "\\]"]],
        processEscapes: true
      },
      options: {
        skipHtmlTags: ["script", "noscript", "style", "textarea", "pre", "code"]
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script src="../assets/engagement.js" defer></script>
  <script src="../assets/markdown-render.js"></script>
  <script src="../assets/bg-rotation.js" defer></script>

  <script>
    const { markdownToHtml } = window.MarkdownRender;

    const BG_ROTATION_IMAGES = [
      "picture/bg2.png",
      "picture/bg1.png"
    ];
    const BG_ROTATION_INTERVAL_MS = 20000;

    window.addEventListener("DOMContentLoaded", () => {
      window.BackgroundRotation?.init({
        layerAId: "bg-layer-a",
        layerBId: "bg-layer-b",
        images: BG_ROTATION_IMAGES,
        intervalMs: BG_ROTATION_INTERVAL_MS
      });
    });

    async function loadDbPost(slug) {
      const response = await fetch(`/api/posts/${encodeURIComponent(slug)}`, { cache: "no-store" });
      const data = await response.json().catch(() => null);
      if (!response.ok || !data?.ok) {
        throw new Error(data?.error || `HTTP ${response.status}`);
      }

      const post = data.post;
      return {
        title: post.title || slug,
        date: post.date || "未設定日期",
        category: post.category || "未分類",
        bodyHtml: markdownToHtml(post.content || "", null),
        pageKey: `post:db:${slug}`
      };
    }

    async function loadPost() {
      const titleEl = document.getElementById("post-title");
      const metaEl = document.getElementById("post-meta");
      const bodyEl = document.getElementById("post-body");
      const errorEl = document.getElementById("error-text");
      const engagementEl = document.getElementById("post-engagement");

      if (window.location.protocol === "file:") {
        errorEl.hidden = false;
        errorEl.textContent = "偵測到 file:// 直接開啟，瀏覽器會阻擋 fetch。請改用 GitHub Pages 或本機伺服器預覽。";
        titleEl.textContent = "無法載入文章";
        return;
      }

      const params = new URLSearchParams(window.location.search);
      const slug = params.get("slug");

      if (!slug) {
        errorEl.hidden = false;
        errorEl.textContent = "找不到文章參數，請從首頁重新進入。";
        titleEl.textContent = "無法載入文章";
        return;
      }

      try {
        const post = await loadDbPost(slug);

        titleEl.textContent = post.title;
        metaEl.textContent = `${post.date} | ${post.category}`;
        bodyEl.innerHTML = post.bodyHtml;

        if (engagementEl) {
          // 文章頁的互動資料以 page key 分開統計每篇文章。
          engagementEl.dataset.pageKey = post.pageKey;
          engagementEl.dataset.pageTitle = post.title;
          engagementEl.dataset.turnstileSiteKey = "";
          window.CloudflareEngagement?.boot?.();
        }

        if (window.MathJax?.typesetClear) {
          window.MathJax.typesetClear([bodyEl]);
        }
        if (window.MathJax?.typesetPromise) {
          await window.MathJax.typesetPromise([bodyEl]);
        } else if (window.MathJax?.typeset) {
          window.MathJax.typeset([bodyEl]);
        }
      } catch (err) {
        errorEl.hidden = false;
        errorEl.textContent = `文章讀取失敗：${err.message}`;
        titleEl.textContent = "無法載入文章";
      }
    }

    loadPost();
  </script>
</body>
</html>
