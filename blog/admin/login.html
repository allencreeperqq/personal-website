<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin 登入</title>
  <style>
    :root {
      --bg-1: #090f1d;
      --bg-2: #122544;
      --panel: rgba(15, 23, 42, 0.72);
      --text: #e2e8f0;
      --muted: #9fb0c6;
      --accent: #38bdf8;
      --accent-2: #0ea5e9;
      --border: rgba(148, 163, 184, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Segoe UI", "Noto Sans TC", sans-serif;
      color: var(--text);
      background:
        linear-gradient(140deg, var(--bg-1), var(--bg-2));
    }

    .login-card {
      width: min(360px, 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: linear-gradient(165deg, rgba(30, 41, 59, 0.6), rgba(15, 23, 42, 0.7)), var(--panel);
      padding: 28px;
      box-shadow: 0 24px 45px rgba(0, 0, 0, 0.35);
    }

    .login-title {
      margin: 0 0 18px;
      font-size: 1.3rem;
    }

    .field {
      display: grid;
      gap: 6px;
      margin-bottom: 14px;
      color: #dbeafe;
      font-size: 0.95rem;
    }

    .field input {
      border: 1px solid rgba(148, 163, 184, 0.35);
      border-radius: 10px;
      background: rgba(2, 6, 23, 0.72);
      color: #e2e8f0;
      padding: 10px 12px;
      font: inherit;
    }

    .field input:focus {
      outline: 2px solid rgba(56, 189, 248, 0.28);
      border-color: rgba(125, 211, 252, 0.65);
    }

    .submit-button {
      width: 100%;
      margin-top: 6px;
      border: 1px solid rgba(125, 211, 252, 0.6);
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #f8fafc;
      font: inherit;
      font-weight: 600;
      padding: 11px;
      cursor: pointer;
    }

    .submit-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .feedback {
      margin: 12px 0 0;
      min-height: 1.3em;
      color: #fca5a5;
      font-size: 0.9rem;
    }

    .back-link {
      display: inline-block;
      margin-top: 16px;
      color: #7dd3fc;
      text-decoration: none;
      font-size: 0.88rem;
    }
  </style>
</head>
<body>
  <main class="login-card">
    <h1 class="login-title">Admin 登入</h1>
    <form id="login-form">
      <label class="field">
        <span>帳號</span>
        <input type="text" name="username" autocomplete="username" required />
      </label>
      <label class="field">
        <span>密碼</span>
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button class="submit-button" type="submit">登入</button>
      <p class="feedback" id="feedback"></p>
    </form>
    <a class="back-link" href="../../index.html">回到首頁</a>
  </main>

  <script>
    const form = document.getElementById("login-form");
    const feedback = document.getElementById("feedback");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const submitButton = form.querySelector(".submit-button");
      submitButton.disabled = true;
      feedback.textContent = "登入中...";

      try {
        const response = await fetch("/api/admin/login", {
          method: "POST",
          credentials: "include",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({
            username: form.username.value,
            password: form.password.value
          })
        });

        const data = await response.json().catch(() => null);
        if (!response.ok || !data?.ok) {
          throw new Error(data?.error || `登入失敗（HTTP ${response.status}）`);
        }

        feedback.style.color = "#86efac";
        feedback.textContent = "登入成功，正在跳轉...";
        window.location.href = "editor.html";
      } catch (error) {
        feedback.style.color = "#fca5a5";
        feedback.textContent = error.message;
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
